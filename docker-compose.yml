# Base partagée par les services construits depuis le Dockerfile (une seule image).
# .env (racine, jamais commité) est lu s'il existe ; DATABASE_URL est ensuite forcée vers
# le conteneur "db" (dans un conteneur, "localhost" désignerait le conteneur lui-même).
x-app: &app
  build: .
  image: solarsouk-app
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tunisovereign_db}
    ALLOWED_HOSTS: localhost,127.0.0.1,web
    # Dans un conteneur, "localhost" est le conteneur lui-même : on pointe vers les autres services.
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    WEB3_RPC_URL: http://anvil-blockchain:8545
    OLLAMA_BASE_URL: http://host.docker.internal:11434

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tunisovereign_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tunisovereign_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  anvil-blockchain:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--block-time", "2"]
    ports:
      - "127.0.0.1:8545:8545"

  # Tâche unique : applique les migrations puis le seed (idempotents), et se termine.
  init:
    <<: *app
    command: sh -c "python backend/manage.py migrate --noinput && python backend/manage.py seed_solarsouk"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: python backend/manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  grpc:
    <<: *app
    command: python grpc_service/server.py
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50051), 2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Données de démo : docker compose run --rm simulate
  simulate:
    <<: *app
    profiles: ["demo"]
    command: sh -c "python simulator/tunisian_simulator.py --days 7 --clear --target grpc:50051 && python backend/manage.py detect_anomalies --clear"
    depends_on:
      grpc:
        condition: service_healthy

  dashboard:
    <<: *app
    command: streamlit run dashboard/streamlit_command_center.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
      anvil-blockchain:
        condition: service_started

  n8n-boundary:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Africa/Tunis
      - TZ=Africa/Tunis
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  pgdata:
  n8n_data: